# After changing the lists, re-encrypt existing files: sops updatekeys secrets/<file>
keys:
  # People: GPG keys, to read and edit secrets by hand
  - &pgp_personal C2006DA935947D3CA6B775E3003005400C7C7B2F
  - &pgp_work 0A1E5F19CCE8DE9357D894CB19421C9B54298D5F
  # Machines: age keys (~/.config/sops/age/keys.txt)
  - &age_SWS000135 age1r209luhl6q7rrjn6ucg0yflm2de6j48q75nkr5kyw93z8u2kaqssxhezyz
  # callisto: derived from its SSH host key (ssh-keyscan callisto.local | ssh-to-age)
  - &age_callisto age1x23l0kddsvyfz2rrnkjk8pg0ue6nuwreyyjtt0awy4c2d8cymuwqd0t038
creation_rules:
  - path_regex: secrets/.*\.yaml$
    key_groups:
