# Moves `release` to `main` once CI on the pushed commit succeeded. callisto's daily
# autoUpgrade follows `release`, so a red commit never reaches the machine.
name: Promote to release

on:
  workflow_run:
    workflows: [ CI ]
    types: [ completed ]
    branches: [ main ]

permissions:
  contents: write

jobs:
  promote:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Force `release` to the commit CI just passed
        run: git push --force origin "HEAD:refs/heads/release"
